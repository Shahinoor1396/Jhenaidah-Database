<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Ultra-soft Gaussian Blur Filters for Aurora Mesh Glow -->
    <filter id="aurora-mesh-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="130" result="blur" />
    </filter>
    <filter id="studio-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" result="glow" />
    </filter>

    <!-- Porcelain Milk-White Base Gradient -->
    <linearGradient id="milky-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFDFF" />
      <stop offset="40%" stop-color="#F8FAFC" />
      <stop offset="75%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#EDF4F9" />
    </linearGradient>

    <!-- Light Royal Blue Mesh Radial Glow -->
    <radialGradient id="royal-blue-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.22" />
      <stop offset="35%" stop-color="#3B82F6" stop-opacity="0.15" />
      <stop offset="65%" stop-color="#60A5FA" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0" />
    </radialGradient>

    <!-- Pastel Teal Mesh Radial Glow -->
    <radialGradient id="pastel-teal-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.20" />
      <stop offset="35%" stop-color="#14B8A6" stop-opacity="0.14" />
      <stop offset="70%" stop-color="#5EEAD4" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#99F6E4" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Cyan & Sky Aurora Beam -->
    <radialGradient id="sky-cyan-beam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#7DD3FC" stop-opacity="0.10" />
      <stop offset="80%" stop-color="#BAE6FD" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0" />
    </radialGradient>

    <!-- Pure Studio White Highlight Orb -->
    <radialGradient id="milk-highlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Base Porcelain & Milk White Canvas -->
  <rect width="1920" height="1080" fill="url(#milky-canvas)" />

  <!-- 2. Primary Aurora Mesh Gradient Clouds (Abstract, Non-distracting, Defocused) -->
  <g filter="url(#aurora-mesh-blur)">
    <!-- Top-Right: Royal Blue Aura with subtle gradient extension -->
    <ellipse cx="1520" cy="160" rx="720" ry="460" fill="url(#royal-blue-glow)" />

    <!-- Top-Left: Pastel Teal Aura -->
    <ellipse cx="260" cy="180" rx="640" ry="420" fill="url(#pastel-teal-glow)" />

    <!-- Center: Ethereal Sky Cyan & Milk Blend -->
    <ellipse cx="980" cy="480" rx="840" ry="540" fill="url(#sky-cyan-beam)" />

    <!-- Bottom-Left: Soft Royal Blue Grounding Aura -->
    <ellipse cx="240" cy="940" rx="680" ry="480" fill="url(#royal-blue-glow)" />

    <!-- Bottom-Right: Pastel Teal Aurora Anchor -->
    <ellipse cx="1660" cy="900" rx="700" ry="480" fill="url(#pastel-teal-glow)" />

    <!-- Mid-Right Subtle Secondary Teal Pulse -->
    <circle cx="1780" cy="540" r="380" fill="url(#pastel-teal-glow)" />

    <!-- Mid-Left Secondary Royal Blue Pulse -->
    <circle cx="120" cy="560" r="360" fill="url(#royal-blue-glow)" />
  </g>

  <!-- 3. Studio Lighting & Milk-White Luminous Glow Core -->
  <g filter="url(#studio-glow)">
    <ellipse cx="920" cy="220" rx="520" ry="240" fill="url(#milk-highlight)" />
    <ellipse cx="1040" cy="760" rx="600" ry="280" fill="url(#milk-highlight)" />
    <circle cx="620" cy="500" r="320" fill="url(#milk-highlight)" />
    <circle cx="1320" cy="460" r="320" fill="url(#milk-highlight)" />
  </g>
</svg>
